<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EUPHORIA_19</title>

    <link rel="stylesheet" href="/static/css/infos.css">

</head>

<body class="theme-{{ cartaz }}">

    <div class="noise"></div>
    <div class="scanlines"></div>

    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="background-grid"></div>


    <div class="panel">

        <div class="panel-header">

            <div>

                <h1>EUPHORIA - DATABASE</h1>

                <p>CLASSIFIED INVITATION SYSTEM</p>

            </div>

            <div class="status-dot">

                ● ONLINE

            </div>

        </div>


        <div class="info-grid">

            <div>

                <span>Guest Status</span>

                <strong>AUTHORIZED</strong>

            </div>

            <div>

                <span>Security Level</span>

                <strong>LEVEL 19</strong>

            </div>

            <div>

                <span>Invitation File</span>

                <strong>INVITATION_{{ cartaz }}.PNG</strong>

            </div>

        </div>


        <div class="preview">

            <div id="loader">

                <div id="loader-terminal"></div>

            </div>


            <img
                id="convite"
                src="/static/img/template{{ cartaz }}.png"
                alt="Convite EUPHORIA_19"
            >

        </div>


        <!-- ======================================
             IMAGE VIEWER
        ======================================= -->

        <div id="image-modal">

            <button
                id="close-modal"
                aria-label="Fechar convite"
            >
                ×
            </button>


            <div class="modal-content">

                <div class="modal-label">

                    INVITATION_FILE_{{ cartaz }}.PNG

                </div>


                <img
                    id="modal-image"
                    src="/static/img/template{{ cartaz }}.png"
                    alt="Convite ampliado"
                >


                <a
                    id="download-button"
                    href="/static/img/template{{ cartaz }}.png"
                    download="EUPHORIA_19_CONVITE.png"
                >

                    DOWNLOAD INVITATION

                </a>

            </div>

        </div>


        <form action="/confirmar" method="POST">

            <input
                type="text"
                name="nome"
                placeholder="Digite seu nome"
                required
            >

            <button>

                AUTHORIZE ATTENDANCE

            </button>

        </form>

    </div>


    <div id="glitch-transition"></div>


    <script src="/static/js/infos.js"></script>

    <script src="/static/js/glitch.js"></script>

</body>

</html>
